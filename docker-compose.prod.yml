# Production additions for a single GPU host.
# Usage: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# --env-file matters: it is where ${BACKEND_URL}, ${DATABASE_PASSWORD} and the
# other substitutions in these files come from. Without it they silently take
# their development defaults.
#
# Only nginx is published (80/443). Everything else is reachable solely on the
# compose network — see the header of docker-compose.yml.

services:
  postgres:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  redis:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  backend:
    restart: always
    env_file: .env.prod
    volumes:
      # The MuseTalk weights (~9 GB). scripts/deploy-aws.sh downloads them to
      # backend/models on the HOST, so that is what gets mounted. This used
      # to be an empty named volume, which hid the downloaded weights from
      # the container: the engine found nothing and every reply fell back to
      # a still image.
      - ./backend/models:/app/models
      # Uploaded avatars and generated clips (USE_LOCAL_STORAGE=true).
      - ./backend/uploads:/app/uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  frontend:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  celery-worker:
    restart: always
    env_file: .env.prod
    volumes:
      - ./backend/models:/app/models
      # Shared with the backend so the cleanup tasks can reach the files.
      - ./backend/uploads:/app/uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  flower:
    # Disable Flower in production (security risk)
    profiles: ["dev"]

  nginx:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
