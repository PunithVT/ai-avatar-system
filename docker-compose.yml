# Base stack. Safe to run as-is: nothing here publishes an application or
# database port, and no source directory is mounted into a container.
#
#   Development   docker compose up -d
#                 (docker-compose.override.yml is picked up automatically and
#                 adds localhost ports plus the backend source mount)
#   Production    docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Dev-only conveniences used to live in THIS file, with the production file
# expected to switch them off. It could not: Compose merges `ports` and
# `volumes` lists across files rather than replacing them, so `ports: []` and
# an override volume list removed nothing. Production ran with the source
# trees bind-mounted over the built images and with the backend (:8000) and
# frontend (:3000) published on every interface, behind nginx's back.

services:
  postgres:
    image: postgres:15-alpine
    container_name: avatar-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-avatar_db}
      POSTGRES_USER: ${DATABASE_USER:-avatar_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-avatar_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - avatar-network

  redis:
    image: redis:7-alpine
    container_name: avatar-redis
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - avatar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avatar-backend
    # Reached through nginx, or on localhost via the dev override. Publishing
    # it directly let clients bypass nginx's rate limits and body cap — and
    # uvicorn trusts X-Forwarded-For, so each request could claim a new IP
    # and never hit the app's own rate limiter either.
    expose:
      - "8000"
    # Everything from .env, the way docker-compose.prod.yml already does it.
    # This used to be an explicit allowlist of 13 keys, which silently dropped
    # 56 of the 69 settings the app defines — AVATAR_ENGINE, FACE_RESTORE,
    # LLM_PROVIDER, CORS_ORIGINS, WHISPER_MODEL and TTS_PROVIDER among them. A
    # setting changed in .env simply had no effect in the container, with no
    # error to explain why. (README and SETUP_GUIDE both start with
    # `cp .env.example .env`, so the file is there.)
    env_file: .env
    # Overrides that must win over .env: inside the compose network these are
    # service names, not localhost, and .env is written for running the
    # backend directly on the host. `environment` takes precedence over
    # `env_file`, which is what makes this work.
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-avatar_user}:${DATABASE_PASSWORD:-change_this_password}@postgres:5432/${DATABASE_NAME:-avatar_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - avatar_cache:/tmp/avatars
      - video_cache:/tmp/videos
      - audio_cache:/tmp/audio
      - voice_profiles:/app/voice_profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - avatar-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked into the client bundle at BUILD time,
      # so they must be passed as build args — runtime `environment` alone
      # has no effect on the compiled JS.
      args:
        - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8000}
        # Empty unless WS_URL is set: the client then derives it from the API
        # URL (http→ws, https→wss), so one setting cannot contradict the other.
        - NEXT_PUBLIC_WS_URL=${WS_URL:-}
        - NEXT_PUBLIC_SITE_URL=${FRONTEND_URL:-http://localhost:3000}
        - NEXT_PUBLIC_S3_BUCKET_DOMAIN=${S3_BUCKET_NAME}
        - NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
    container_name: avatar-frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${WS_URL:-}
      - NEXT_PUBLIC_S3_BUCKET_DOMAIN=${S3_BUCKET_NAME}
      - NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the standalone server listens on IPv4 only,
      # and in the Alpine image `localhost` resolves to ::1 first — the probe
      # was refused, the container went unhealthy, and nginx (which waits on
      # this check) never started.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - avatar-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avatar-celery-worker
    # --beat runs the scheduler inside this worker. Without it the schedule in
    # celery_app.py was never executed by anything: the guest-account and
    # media cleanups were defined, documented, and had never once run. An
    # embedded scheduler is right for a single worker; if this service is
    # ever scaled past one replica, move beat to its own service so the
    # schedule does not fire once per replica.
    command: celery -A app.celery_app worker --beat --schedule /tmp/celerybeat-schedule --loglevel=info --concurrency=2
    # Same reasoning as the backend: the worker runs the same application code
    # (avatar_animator.animate, tts_service.synthesize), so it needs the same
    # settings. An allowlist here meant a task could behave differently from
    # the API serving it, on the same .env.
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-avatar_user}:${DATABASE_PASSWORD:-change_this_password}@postgres:5432/${DATABASE_NAME:-avatar_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - avatar_cache:/tmp/avatars
      - video_cache:/tmp/videos
      - audio_cache:/tmp/audio
      - voice_profiles:/app/voice_profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - avatar-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avatar-flower
    command: celery -A app.celery_app flower --port=5555
    # Flower imports the app, and the app refuses to start without its
    # secrets — with no env_file this container crash-looped.
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - avatar-network
    restart: unless-stopped

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: avatar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - avatar-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  avatar_cache:
    driver: local
  video_cache:
    driver: local
  audio_cache:
    driver: local
  voice_profiles:
    driver: local

networks:
  avatar-network:
    driver: bridge
