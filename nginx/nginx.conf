events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # WebSocket HANDSHAKES (not frames — nginx cannot see those; the app
    # limits turns per user itself). Bounds reconnect storms and attempts to
    # exhaust the connection cap.
    limit_req_zone $binary_remote_addr zone=ws:10m rate=30r/m;

    # Log the path without its query string. The WebSocket URL can carry the
    # session token as ?token=…, and the default format writes the full
    # request line — putting live credentials in the access log.
    log_format noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log noquery;

    server {
        listen 80;
        server_name localhost;

        # Above the app's own caps (10 MB avatar image, 20 MB voice sample)
        # with room for multipart framing, so the app enforces the limit and
        # answers with its own message. At 10M nginx rejected every voice
        # sample over 10 MB — and avatar images near the cap — before the app
        # ever saw them.
        client_max_body_size 25M;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded avatars and generated clips (USE_LOCAL_STORAGE=true). The
        # app builds these URLs as BACKEND_URL/uploads/…; behind this proxy
        # that is this server, and without this block the request fell
        # through to the frontend and 404'd — no avatar images, no video.
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # X-Forwarded-For is what uvicorn's proxy-header handling reads to
            # recover the real client address; without it WebSocket traffic was
            # attributed to nginx, unlike /api/ which already forwarded it.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Health check
        location /health {
            proxy_pass http://backend/health;
        }

        # API docs (development only)
        location /docs {
            proxy_pass http://backend/docs;
        }

        location /redoc {
            proxy_pass http://backend/redoc;
        }

        location /openapi.json {
            proxy_pass http://backend/openapi.json;
        }
    }
}
